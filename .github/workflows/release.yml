name: release

# Push a tag like v3.0.8 to build, sign and publish one release with the Windows client, server and
# observer AND the macOS client. The tag must equal the version in pom.xml on main, observer-server
# and macos. Running apps pick the new version up from
# https://github.com/<repo>/releases/latest/download/update-<app>.properties
# (macOS clients use update-client-mac-arm64.properties and update-client-mac-x64.properties).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out main (client + server)
        uses: actions/checkout@v4
        with:
          path: main
          ref: main

      - name: Check out observer-server (observer)
        uses: actions/checkout@v4
        with:
          path: observer
          ref: observer-server

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: main/pom.xml

      - name: Install Launch4j 3.50
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'launch4j.zip'
          for ($i = 1; $i -le 4; $i++) {
            curl.exe -L -sS -A 'curl/8.4.0' -o $zip 'https://sourceforge.net/projects/launch4j/files/launch4j-3/3.50/launch4j-3.50-win32.zip/download'
            if ((Test-Path $zip) -and (Get-FileHash $zip).Hash -eq '93621E5007106A01AD3CBB84871886E8E8D6A6BECA7111842EAAF0CF85B57767') { break }
            Write-Host "download attempt $i did not give the expected file"; Start-Sleep -Seconds 10
          }
          if ((Get-FileHash $zip).Hash -ne '93621E5007106A01AD3CBB84871886E8E8D6A6BECA7111842EAAF0CF85B57767') { throw 'Launch4j 3.50 zip hash mismatch' }
          Expand-Archive $zip C:\ -Force
          "LAUNCH4J_HOME=C:\launch4j" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Tag must match the pom version on both branches
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          foreach ($d in 'main', 'observer') {
            [xml]$pom = Get-Content "$d/pom.xml"
            if ($pom.project.version -ne $tag) { throw "$d/pom.xml is $($pom.project.version), tag is $tag" }
          }

      - name: Build client and server zips
        shell: pwsh
        working-directory: main
        run: powershell -ExecutionPolicy Bypass -File build\build-exe.ps1 -Online -BundleJre -Package

      - name: Build observer zip
        shell: pwsh
        working-directory: observer
        run: powershell -ExecutionPolicy Bypass -File build\build-exe.ps1 -Online -BundleJre -Package -Only observer

      - name: Write and sign manifests
        shell: pwsh
        env:
          SRD_UPDATE_PRIVATE_KEY: ${{ secrets.SRD_UPDATE_PRIVATE_KEY }}
        run: |
          if (-not $env:SRD_UPDATE_PRIVATE_KEY) { throw 'secret SRD_UPDATE_PRIVATE_KEY is not set' }
          $ver = '${{ github.ref_name }}'.TrimStart('v')
          $repo = '${{ github.repository }}'
          $tag = '${{ github.ref_name }}'
          New-Item -ItemType Directory -Force release | Out-Null
          $cp = 'main/srd-common/target/classes'
          $apps = @(
            @{ App = 'client';   Name = 'SecureRemoteDesktopClient';   Dist = 'main/dist' },
            @{ App = 'server';   Name = 'SecureRemoteDesktopServer';   Dist = 'main/dist' },
            @{ App = 'observer'; Name = 'SecureRemoteDesktopObserver'; Dist = 'observer/dist' }
          )
          foreach ($a in $apps) {
            $zipName = "$($a.Name)-$ver-win64.zip"
            $zip = Join-Path $a.Dist $zipName
            if (-not (Test-Path $zip)) { throw "missing $zip" }
            Copy-Item $zip release
            $mf = "release/update-$($a.App).properties"
            $url = "https://github.com/$repo/releases/download/$tag/$zipName"
            java -cp $cp com.srd.common.update.UpdateTool manifest $a.App $ver (Join-Path 'release' $zipName) $url $mf
            if ($LASTEXITCODE -ne 0) { throw "manifest failed for $($a.App)" }
            java -cp $cp com.srd.common.update.UpdateTool sign $mf
            if ($LASTEXITCODE -ne 0) { throw "sign failed for $($a.App)" }
          }
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload Windows release files
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - name: Check out macos (macOS client)
        uses: actions/checkout@v4
        with:
          path: macos
          ref: macos

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: macos/pom.xml

      - name: Tag must match the pom version on the macos branch
        shell: bash
        run: |
          tag='${{ github.ref_name }}'
          ver="${tag#v}"
          pomver="$(python3 -c "import xml.etree.ElementTree as E; ns={'m': 'http://maven.apache.org/POM/4.0.0'}; print(E.parse('macos/pom.xml').getroot().find('m:version', ns).text)")"
          if [ "$pomver" != "$ver" ]; then echo "macos/pom.xml is $pomver, tag is $ver"; exit 1; fi

      - name: Build the client jar
        working-directory: macos
        run: mvn -B -DskipTests package -pl srd-client -am

      - name: Package the macOS apps (arm64 and x64)
        working-directory: macos
        run: |
          ver='${{ github.ref_name }}'
          python3 build/package_macos.py --jar srd-client/target/SecureRemoteDesktopClient.jar \
            --version "${ver#v}" --out '${{ github.workspace }}/release-macos'

      - name: Write and sign the macOS manifests
        shell: bash
        env:
          SRD_UPDATE_PRIVATE_KEY: ${{ secrets.SRD_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SRD_UPDATE_PRIVATE_KEY" ]; then echo 'secret SRD_UPDATE_PRIVATE_KEY is not set'; exit 1; fi
          tag='${{ github.ref_name }}'
          ver="${tag#v}"
          repo='${{ github.repository }}'
          out='${{ github.workspace }}/release-macos'
          cp='macos/srd-common/target/classes'
          for arch in arm64 x64; do
            zip="$out/SecureRemoteDesktopClient-$ver-macos-$arch.zip"
            test -f "$zip"
            url="https://github.com/$repo/releases/download/$tag/$(basename "$zip")"
            mf="$out/update-client-mac-$arch.properties"
            java -cp "$cp" com.srd.common.update.UpdateTool manifest "client-mac-$arch" "$ver" "$zip" "$url" "$mf"
            java -cp "$cp" com.srd.common.update.UpdateTool sign "$mf"
          done
          ls -la "$out"

      - name: Upload macOS release files
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release-macos/*
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download the Windows and macOS files
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' release/* --repo '${{ github.repository }}' \
            --title '${{ github.ref_name }}' --generate-notes
